# Merge these settings into nagios.cfg; do not add duplicate directives.
# The live file and batch directory MUST share a filesystem for atomic rename.
process_performance_data=1
service_perfdata_file=/var/spool/nagios-graphs/service-perfdata
service_perfdata_file_template=$TIMET$\t$HOSTNAME$\t$SERVICEDESC$\t$SERVICEPERFDATA$
service_perfdata_file_mode=a
service_perfdata_file_processing_interval=60
service_perfdata_file_processing_command=seal-graph-perfdata

# Add this object to a loaded Nagios object configuration file.
define command {
    command_name seal-graph-perfdata
    command_line /usr/bin/python3 /usr/local/libexec/nagios-rrd-seal.py /var/spool/nagios-graphs/service-perfdata
}

# Add to the corresponding service definition, using the graph id in graphs.json:
# process_perf_data 1
# action_url /nagios4/cgi-bin/graphs.cgi?view=server-temperature
